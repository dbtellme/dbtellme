[project]
name = "dbtellme"
version = "0.1.0"
description = "Connect your database to AI. Auto-generate RAG, fine-tune, and AI prompt datasets from any DB schema."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "dbtellme" }
]
keywords = [
    "database", "llm", "ai", "rag", "fine-tuning",
    "schema", "annotation", "sqlalchemy", "erp", "woocommerce"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/dbtellme/dbtellme"
Repository = "https://github.com/dbtellme/dbtellme"
Issues = "https://github.com/dbtellme/dbtellme/issues"
Changelog = "https://github.com/dbtellme/dbtellme/releases"

[project.optional-dependencies]
postgres   = ["psycopg2-binary"]
mysql      = ["pymysql"]
mssql      = ["pyodbc"]
all-db     = ["psycopg2-binary", "pymysql", "pyodbc"]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
]

[project.scripts]
dbtellme = "dbtellme.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ── Packaging ────────────────────────────────────────────────────────────────
# Without the package-data block below, setuptools ships ONLY .py files:
# the Flask templates, the static assets and every annotation template YAML
# are silently dropped from the wheel and `dbtellme ui` dies with
# TemplateNotFound: index.html. Verify with: unzip -l dist/*.whl

[tool.setuptools.packages.find]
include = ["dbtellme*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
dbtellme = [
    "templates/*/*.yaml",
    "web/templates/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
