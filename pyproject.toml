[project]
name = "dbtellme"
version = "0.1.0"
description = "Connect your database to AI. Auto-generate RAG, fine-tune, and AI prompt datasets from any DB schema."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "dbtellme" }
]
keywords = [
    "database", "llm", "ai", "rag", "fine-tuning",
    "schema", "annotation", "sqlalchemy", "erp", "woocommerce"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "mermaid-py>=0.3.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/dbtellme/dbtellme"
Repository = "https://github.com/dbtellme/dbtellme"
Issues = "https://github.com/dbtellme/dbtellme/issues"
Changelog = "https://github.com/dbtellme/dbtellme/releases"

[project.optional-dependencies]
postgres   = ["psycopg2-binary"]
mysql      = ["pymysql"]
mssql      = ["pyodbc"]
all-db     = ["psycopg2-binary", "pymysql", "pyodbc"]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
dbtellme = "dbtellme.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
